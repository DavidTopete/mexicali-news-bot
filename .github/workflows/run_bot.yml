name: Run Mexicali News Bot

on:
  schedule:
    # Ajusta el horario si ya tienes uno diferente.
    # 04:00 AM Mexicali normalmente corresponde a UTC-7 o UTC-8
    # según horario estacional. Este ejemplo usa 12:00 UTC.
    - cron: '0 12 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexicali-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow

      - name: Run bot
        run: python telegram_bot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save bot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias_enviadas_mexicali.json

          if git diff --cached --quiet; then
            echo "No changes in noticias_enviadas_mexicali.json"
            exit 0
          fi

          git commit -m "Update noticias_enviadas_mexicali.json"

          git pull --rebase origin main
          git push origin HEAD:main
